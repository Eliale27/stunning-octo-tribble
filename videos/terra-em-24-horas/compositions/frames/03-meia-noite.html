  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var CX = 540, CY = 520;

      // --- build the 24 dial ticks (deterministic) ---
      var ticks = document.getElementById("f03-meia-noite-ticks");
      if (ticks && ticks.childNodes.length === 0) {
        var SVGNS = "http://www.w3.org/2000/svg";
        for (var i = 0; i < 24; i++) {
          var ang = (i * 15) * Math.PI / 180;
          var sinA = Math.sin(ang), cosA = Math.cos(ang);
          var major = (i % 6 === 0);
          var rOut = 300;
          var rIn = major ? 274 : 286;
          var line = document.createElementNS(SVGNS, "line");
          line.setAttribute("x1", (CX + sinA * rOut).toFixed(2));
          line.setAttribute("y1", (CY - cosA * rOut).toFixed(2));
          line.setAttribute("x2", (CX + sinA * rIn).toFixed(2));
          line.setAttribute("y2", (CY - cosA * rIn).toFixed(2));
          line.setAttribute("stroke", major ? "#E85D26" : "#505048");
          line.setAttribute("stroke-width", major ? "3" : "1.5");
          ticks.appendChild(line);
        }
      }

      // --- scatter the converging particles (index-derived, no random) ---
      var frags = Array.prototype.slice.call(
        document.querySelectorAll(".f03-meia-noite-frag"));
      var n = frags.length;
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      var RADIUS = 380, Z_NEAR = 320, Z_FAR = -320, TUMBLE = 70;
      var scatter = frags.map(function (el, i) {
        var a = i * GOLDEN;
        var depthT = n > 1 ? i / (n - 1) : 0;
        return {
          x: Math.cos(a) * RADIUS,
          y: Math.sin(a) * RADIUS,
          z: Z_NEAR - depthT * (Z_NEAR - Z_FAR),
          rotationX: Math.sin(a) * TUMBLE,
          rotationY: Math.cos(a) * TUMBLE
        };
      });
      frags.forEach(function (el, i) {
        gsap.set(el, {
          xPercent: -50, yPercent: -50,
          x: scatter[i].x, y: scatter[i].y, z: scatter[i].z,
          rotationX: scatter[i].rotationX, rotationY: scatter[i].rotationY,
          opacity: 0
        });
      });

      gsap.set("#f03-meia-noite-pointer", { svgOrigin: "540 520" });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-meia-noite"] = tl;

      // ---- Scene 1 (0.0–~1.0): dial establishes, pointer snaps to 00h, chrome enters ----
      tl.fromTo(".f03-meia-noite-dial",
        { opacity: 0, scale: 0.92, transformOrigin: "540px 520px" },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" }, 0.05);

      tl.fromTo(".f03-meia-noite-kicker",
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.18);

      // ember seed — the planet core, visible by t <= 0.5
      tl.fromTo(".f03-meia-noite-ember",
        { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" },
        { opacity: 0.85, scale: 1, duration: 0.5, ease: "power2.out" }, 0.10);

      // pointer snaps to 00h with a tick + tiny settle
      tl.fromTo("#f03-meia-noite-pointer",
        { rotation: -24 },
        { rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 0.28);

      tl.fromTo(".f03-meia-noite-readout",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.fromTo([".f03-meia-noite-hair", ".f03-meia-noite-sub"],
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.62);

      // ---- Scene 2 (~1.0–2.5): particles converge (depth-scatter-assemble) & fuse ----
      // gentle cloud spin gives the scatter life during the collapse
      tl.fromTo("#f03-meia-noite-stage",
        { rotationY: 0 },
        { rotationY: 42, duration: 1.5, ease: "power1.out" }, 0.9);

      var ASSEMBLE_DUR = 0.95, STAGGER = 0.05;
      frags.forEach(function (el, i) {
        // travel in from the cloud toward the core, opacity rising
        tl.to(el, {
          x: Math.cos(i * GOLDEN) * 30, y: Math.sin(i * GOLDEN) * 30, z: 0,
          rotationX: 0, rotationY: 0, opacity: 1,
          duration: ASSEMBLE_DUR, ease: "power3.out"
        }, 0.9 + i * STAGGER);
        // fuse into the core: shrink + fade into the incandescent sphere (mid-shot)
        tl.to(el, {
          x: 0, y: 0, scale: 0.25, opacity: 0,
          duration: 0.4, ease: "power2.in"
        }, 1.9 + i * STAGGER);
      });

      // glow bloom grows warm behind the fusing core
      tl.fromTo(".f03-meia-noite-glow",
        { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 1.35);

      // planet sphere blooms from the seed
      tl.fromTo([".f03-meia-noite-planet", ".f03-meia-noite-rim"],
        { opacity: 0, scale: 0.18, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" }, 1.7);
      // ember hands off into the full sphere
      tl.to(".f03-meia-noite-ember",
        { opacity: 0, duration: 0.5, ease: "power1.in" }, 2.05);

      // ---- Scene 3 (~2.5–3.392): one pulse, then hold with subtle rim jitter ----
      // the single pulse
      tl.to(".f03-meia-noite-planet",
        { scale: 1.06, duration: 0.18, ease: "power2.out" }, 2.5);
      tl.to(".f03-meia-noite-rim",
        { scale: 1.09, duration: 0.18, ease: "power2.out" }, 2.5);
      tl.to([".f03-meia-noite-planet", ".f03-meia-noite-rim"],
        { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.68);
      tl.to(".f03-meia-noite-glow",
        { scale: 1.08, duration: 0.18, ease: "power2.out" }, 2.5);
      tl.to(".f03-meia-noite-glow",
        { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.68);

      // held read — chaos suggested by a deterministic keyframed rim jitter (no repeat/yoyo)
      tl.to(".f03-meia-noite-rim", { rotation: 1.4, duration: 0.14, ease: "sine.inOut" }, 3.0);
      tl.to(".f03-meia-noite-rim", { rotation: -1.1, duration: 0.13, ease: "sine.inOut" }, 3.14);
      tl.to(".f03-meia-noite-rim", { rotation: 0.8, duration: 0.12, ease: "sine.inOut" }, 3.27);
      tl.to(".f03-meia-noite-rim", { rotation: 0, duration: 0.112, ease: "sine.inOut" }, 3.39);
      // faint warmth flicker on the rim during the hold (deterministic keyframes)
      tl.to(".f03-meia-noite-rim", { opacity: 0.86, duration: 0.13 }, 3.0);
      tl.to(".f03-meia-noite-rim", { opacity: 1, duration: 0.13 }, 3.14);

      tl.set({}, {}, 3.392);
    })();
  </script>
