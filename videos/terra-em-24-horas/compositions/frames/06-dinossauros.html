  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) { return document.getElementById(id); };

      // deterministic dial ticks — 24h face, 00 at top
      var g = byId("06-dinossauros-ticks");
      if (g) {
        for (var i = 0; i < 24; i++) {
          var ang = (i * 15) * Math.PI / 180;
          var major = (i % 6 === 0);
          var rOut = 300;
          var rIn = major ? 262 : 280;
          var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
          ln.setAttribute("x1", 350 + rIn * Math.sin(ang));
          ln.setAttribute("y1", 350 - rIn * Math.cos(ang));
          ln.setAttribute("x2", 350 + rOut * Math.sin(ang));
          ln.setAttribute("y2", 350 - rOut * Math.cos(ang));
          ln.setAttribute("stroke", i === 0 ? "#E85D26" : "#505048");
          ln.setAttribute("stroke-width", major ? 4 : 2);
          g.appendChild(ln);
        }
      }

      // element handles (getElementById tolerates the digit-leading ids)
      var darken   = byId("06-dinossauros-darken");
      var kicker   = byId("06-dinossauros-kicker");
      var rule     = byId("06-dinossauros-rule");
      var dial     = byId("06-dinossauros-dialstage");
      var pointer  = byId("06-dinossauros-pointer");
      var t2230    = byId("06-dinossauros-t2230");
      var t2340    = byId("06-dinossauros-t2340");
      var sauropod = byId("06-dinossauros-sauropod");
      var theropod = byId("06-dinossauros-theropod");
      var streak   = byId("06-dinossauros-streak");
      var flash    = byId("06-dinossauros-flash");

      // directional motion-blur proxy for the asteroid streak
      var blurNode = byId("06-dinossauros-blur");
      var blurProxy = { v: 26 };
      function writeBlur() { blurNode.setAttribute("stdDeviation", blurProxy.v + " 0"); }
      writeBlur(); // seed frame 0

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–2.0): dark register, dial + pointer at ~22:30, silhouettes rise ----
      tl.fromTo(dial, { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", transformOrigin: "50% 50%" }, 0.0);
      tl.fromTo(kicker, { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo(rule, { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.32);
      tl.fromTo(pointer, { rotation: 300 },
        { rotation: 337.5, duration: 0.95, ease: "power3.out", transformOrigin: "50% 100%" }, 0.15);
      tl.fromTo(sauropod, { opacity: 0, y: 190 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.6);
      tl.fromTo(theropod, { opacity: 0, y: 210 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.95);
      tl.fromTo(t2230, { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.1);

      // ---- Scene 2 (2.0–3.5): pointer advances to 23:40, orange label lights, ground darkens ----
      tl.to(pointer, { rotation: 355, duration: 0.95, ease: "power2.inOut" }, 2.0);
      // text-to-text handoff (dims in place — not an off-frame exit)
      tl.to(t2230, { opacity: 0.22, y: -18, duration: 0.5, ease: "power2.in" }, 2.15);
      tl.fromTo(t2340, { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.35);
      tl.to(darken, { opacity: 0.3, duration: 1.0, ease: "power1.inOut" }, 2.2);

      // ---- Scene 3 (3.5–5.184): asteroid streak cuts the dial, bursts, silhouettes gone, held quiet ----
      tl.fromTo(streak, { x: -1080, opacity: 0 },
        { x: 60, opacity: 1, duration: 0.42, ease: "power4.out" }, 3.55);
      tl.to(blurProxy, { v: 0, duration: 0.42, ease: "power4.out", onUpdate: writeBlur }, 3.55);

      // flash — deterministic keyframed opacity burst
      tl.fromTo(flash, { opacity: 0, scale: 0.28 },
        { opacity: 1, scale: 1.0, duration: 0.09, ease: "power2.out", transformOrigin: "50% 50%" }, 3.95);
      tl.to(flash, { scale: 1.4, duration: 0.5, ease: "power2.out" }, 4.04);
      tl.to(flash, { opacity: 0, duration: 0.42, ease: "power2.in" }, 4.06);

      // hard cut: silhouettes vanish at the flash peak (instant, masked by the burst — not an exit tween)
      tl.set([sauropod, theropod], { opacity: 0 }, 4.02);

      // the disc goes quiet — dim in place, faint scar remains (held beat of inevitability to 5.184)
      tl.to(dial, { opacity: 0.5, duration: 0.4, ease: "power2.out" }, 4.08);
      tl.to(streak, { opacity: 0.22, duration: 0.4, ease: "power2.out" }, 4.1);
      tl.to(t2340, { opacity: 0.6, duration: 0.4, ease: "power2.out" }, 4.1);

      window.__timelines["06-dinossauros"] = tl;
    })();
  </script>
