      var brunoArmR = bruno.querySelector(".arm-r");
      var brunoBody = bruno.querySelector(".body");
      var gasparEyes= gaspar.querySelector(".eyes");
      var gasparBody= gaspar.querySelector(".body");
      var ticoEyes  = tico.querySelector(".eyes");
      var ticoBody  = tico.querySelector(".body");
      var ticoWing  = tico.querySelector(".wing");

      var tl = gsap.timeline({ paused: true });

      /* ---------- estado inicial (determinístico) ---------- */
      tl.set(liaMove,    { x: -320, opacity: 0 }, 0);
      tl.set(liaTilt,    { rotation: 0 }, 0);
      tl.set(brunoMove,  { y: 70, opacity: 0 }, 0);
      tl.set(brunoTilt,  { rotation: 0 }, 0);
      tl.set(gasparMove, { x: -150, y: 0, opacity: 0 }, 0);
      tl.set(ticoMove,   { x: -380, y: -260, opacity: 0 }, 0);
      tl.set(brunoArmR,  { rotation: 0 }, 0);
      tl.set(ticoWing,   { rotation: 0 }, 0);
      tl.set(bubble,     { opacity: 0 }, 0);
      tl.set([liaMouthO], { opacity: 0 }, 0);
      tl.set([liaMouthC], { opacity: 1 }, 0);

      /* =========================================================
         Cena 1 (0.0–4.0s) — o vale da abertura, rio cheio; narrador
         ========================================================= */

      /* nuvens derivam a cena inteira */
      tl.fromTo(clouds[0], { x: 0 }, { x: 84,  duration: 10, ease: "none" }, 0);
      tl.fromTo(clouds[1], { x: 0 }, { x: -62, duration: 10, ease: "none" }, 0);
      tl.fromTo(clouds[2], { x: 0 }, { x: 96,  duration: 10, ease: "none" }, 0);

      /* sol gira devagar */
      tl.fromTo(sun, { rotation: 0 }, { rotation: 9, duration: 10, ease: "none" }, 0);

      /* a superfície da água balança de leve */
      tl.to(water, { x: 3,  duration: 1.6, ease: "sine.inOut" }, 0.2);
      tl.to(water, { x: -3, duration: 1.8, ease: "sine.inOut" }, 1.8);
      tl.to(water, { x: 2,  duration: 1.7, ease: "sine.inOut" }, 3.6);
      tl.to(water, { x: -2, duration: 1.7, ease: "sine.inOut" }, 5.3);
      tl.to(water, { x: 2,  duration: 1.6, ease: "sine.inOut" }, 7.0);
      tl.to(water, { x: 0,  duration: 1.3, ease: "sine.inOut" }, 8.6);

      /* ondulações descem o rio devagar */
      tl.fromTo(ripples[0], { y: 0, x: 0 }, { y: 40, x: -6, duration: 10, ease: "none" }, 0);
      tl.fromTo(ripples[1], { y: 0, x: 0 }, { y: 34, x: -8, duration: 10, ease: "none" }, 0);
      tl.fromTo(ripples[2], { y: 0, x: 0 }, { y: 28, x: -4, duration: 10, ease: "none" }, 0);
      tl.to(ripples[0], { opacity: 0.65, duration: 0.9, ease: "sine.inOut" }, 1.4);
      tl.to(ripples[0], { opacity: 1,    duration: 0.9, ease: "sine.inOut" }, 2.3);
      tl.to(ripples[1], { opacity: 0.65, duration: 0.9, ease: "sine.inOut" }, 2.0);
      tl.to(ripples[1], { opacity: 1,    duration: 0.9, ease: "sine.inOut" }, 2.9);
      tl.to(ripples[2], { opacity: 0.65, duration: 0.9, ease: "sine.inOut" }, 4.6);
      tl.to(ripples[2], { opacity: 1,    duration: 0.9, ease: "sine.inOut" }, 5.5);

      /* brilhos pipocam na água enquanto o narrador fala */
      function spark(el, at) {
        tl.fromTo(el,
          { scale: 0, rotation: -50, opacity: 0 },
          { scale: 1, rotation: 0, opacity: 1, duration: 0.4, ease: "back.out(2.6)" }, at);
        tl.to(el, { opacity: 0, scale: 0.5, duration: 0.5, ease: "power1.in" }, at + 1.0);
      }
      spark(sparks[0], 0.7);
      spark(sparks[1], 1.6);
      spark(sparks[2], 2.5);

      /* =========================================================
         Cena 2 (4.0–7.4s) — os quatro na margem; Lia fala para eles
         ========================================================= */

      /* Bruno chega primeiro, atrás */
      tl.to(brunoMove, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, 3.65);

      /* Lia entra andando pela esquerda, com bob de passo */
      tl.to(liaMove, { x: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 3.72);
      for (var i = 0; i < 3; i++) {
        var t0 = 3.74 + i * 0.18;
        tl.to(liaMove, { y: -5, duration: 0.09, ease: "sine.out" }, t0);
        tl.to(liaMove, { y: 0,  duration: 0.09, ease: "sine.in"  }, t0 + 0.09);
      }

      /* Gaspar chega em dois pulinhos e para aos pés dela */
      tl.to(gasparMove, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 3.95);
      tl.to(gasparMove, { y: -26, duration: 0.16, ease: "sine.out" }, 3.95);
      tl.to(gasparMove, { y: 0,   duration: 0.16, ease: "sine.in"  }, 4.11);
      tl.to(gasparMove, { y: -14, duration: 0.13, ease: "sine.out" }, 4.27);
      tl.to(gasparMove, { y: 0,   duration: 0.13, ease: "sine.in"  }, 4.40);
      tl.to(gasparBody, { scaleY: 0.9, duration: 0.1, ease: "power2.out" }, 4.53);
      tl.to(gasparBody, { scaleY: 1,   duration: 0.16, ease: "back.out(2)" }, 4.63);

      /* Tico plana até o ombro dela e pousa */
      tl.to(ticoMove, { x: 0, y: 0, opacity: 1, duration: 0.62, ease: "power2.out" }, 4.02);
      tl.to(ticoBody, { scaleY: 0.85, duration: 0.1, ease: "power2.out" }, 4.64);
      tl.to(ticoBody, { scaleY: 1,    duration: 0.16, ease: "back.out(2.4)" }, 4.74);

      /* asinha bate na chegada (flap explícito, determinístico) */
      var wt = 4.02, won = true;
      while (wt < 4.62) {
        tl.set(ticoWing, { rotation: won ? -24 : 8 }, wt);
        won = !won; wt += 0.075;
      }
      tl.set(ticoWing, { rotation: 0 }, 4.64);

      /* Lia vira o corpo para os amigos (fala olhando para ELES) */
      tl.to(liaTilt, { rotation: 4, duration: 0.4, ease: "power2.inOut" }, 4.25);
      tl.to(liaEyes, { x: 4.5, duration: 0.3, ease: "power2.out" }, 4.28);

      /* balão spring-pop */
      tl.fromTo(bubble,
        { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.4)" }, 4.32);
      tl.to(bubble, { opacity: 0, scale: 0.72, duration: 0.2, ease: "back.in(1.4)" }, 7.42);

      /* lip flap da Lia — 8 Hz, janela 4.32–7.42 (só ela; o narrador já calou) */
      var START = 4.32, END = 7.42, FLAP = 0.0625;
      var on = true, t = START;
      while (t < END) {
        tl.set(liaMouthO, { opacity: on ? 1 : 0 }, t);
        tl.set(liaMouthC, { opacity: on ? 0 : 1 }, t);
        on = !on; t += FLAP;
      }
      tl.set(liaMouthO, { opacity: 0 }, END);
      tl.set(liaMouthC, { opacity: 1 }, END);

      /* os bichos reagem enquanto ela fala */
      tl.to(brunoBody, { scaleY: 1.025, duration: 0.6, ease: "sine.inOut" }, 5.0);
      tl.to(brunoBody, { scaleY: 1,     duration: 0.6, ease: "sine.inOut" }, 5.6);
      tl.to(gasparMove, { y: -20, duration: 0.15, ease: "sine.out" }, 6.15);
      tl.to(gasparMove, { y: 0,   duration: 0.15, ease: "sine.in"  }, 6.30);
      tl.to(ticoMove,   { y: -8,  duration: 0.12, ease: "sine.out" }, 6.42);
      tl.to(ticoMove,   { y: 0,   duration: 0.12, ease: "sine.in"  }, 6.54);

      /* piscadas — 1–2 por personagem, ninguém junto */
      function blink(eyes, at) {
        tl.to(eyes, { scaleY: 0.1, duration: 0.06, ease: "power2.in"  }, at);
        tl.to(eyes, { scaleY: 1,   duration: 0.06, ease: "power2.out" }, at + 0.06);
      }
      blink(liaEyes,    5.15);
      blink(gasparEyes, 5.70);
      blink(brunoEyes,  6.35);
      blink(ticoEyes,   6.85);
      blink(liaEyes,    8.55);
      blink(brunoEyes,  9.30);

      /* =========================================================
         Cena 3 (7.4–10.0s) — os quatro olham o rio; pata do Bruno;
         Tico dá um voo curto e volta. Batida de fecho.
         ========================================================= */

      /* todos viram o olhar para o rio */
      tl.to(liaTilt,  { rotation: -2, duration: 0.5, ease: "power2.inOut" }, 7.48);
      tl.to(liaEyes,  { x: 6, y: -2, duration: 0.35, ease: "power2.out" }, 7.52);
      tl.to(brunoEyes,{ x: 4, duration: 0.35, ease: "power2.out" }, 7.56);
      tl.to(gasparEyes,{ x: 4, duration: 0.35, ease: "power2.out" }, 7.60);
      tl.to(brunoTilt,{ rotation: 2.5, duration: 0.5, ease: "power2.inOut" }, 7.55);

      /* Gaspar dá um pulinho de contente virado pro rio */
      tl.to(gasparMove, { y: -16, duration: 0.14, ease: "sine.out" }, 7.72);
      tl.to(gasparMove, { y: 0,   duration: 0.14, ease: "sine.in"  }, 7.86);

      /* Bruno levanta a pata (saudação ao rio) */
      tl.to(brunoArmR, { rotation: -145, duration: 0.5, ease: "back.out(1.7)" }, 7.60);
      tl.to(brunoArmR, { rotation: -128, duration: 0.25, ease: "sine.inOut" }, 8.35);
      tl.to(brunoArmR, { rotation: -142, duration: 0.25, ease: "sine.inOut" }, 8.60);

      /* Tico dá um voo curto em arco sobre o grupo e volta ao ombro */
      tl.to(ticoMove, { x: 36,  y: -80,  duration: 0.28, ease: "power2.out" }, 7.90);
      tl.to(ticoMove, { x: 140, y: -185, duration: 0.42, ease: "sine.inOut" }, 8.18);
      tl.to(ticoMove, { x: 205, y: -140, duration: 0.32, ease: "sine.inOut" }, 8.60);
      tl.to(ticoMove, { x: 110, y: -52,  duration: 0.34, ease: "sine.inOut" }, 8.92);
      tl.to(ticoMove, { x: 0,   y: 0,    duration: 0.34, ease: "power2.inOut" }, 9.26);
      tl.to(ticoBody, { scaleY: 0.85, duration: 0.1, ease: "power2.out" }, 9.60);
      tl.to(ticoBody, { scaleY: 1,    duration: 0.14, ease: "back.out(2.4)" }, 9.70);

      /* asas batendo durante o voo (flap explícito) */
      wt = 7.88; won = true;
      while (wt < 9.55) {
        tl.set(ticoWing, { rotation: won ? -26 : 10 }, wt);
        won = !won; wt += 0.075;
      }
      tl.set(ticoWing, { rotation: 0 }, 9.60);

      /* um último brilho na água quando eles olham */
      spark(sparks[3], 8.25);

      /* respiro final da Lia — o quadro assenta, sem sair */
      tl.to(liaMove, { y: -3, duration: 0.24, ease: "sine.inOut" }, 9.50);
      tl.to(liaMove, { y: 0,  duration: 0.24, ease: "sine.inOut" }, 9.74);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
