name: Assemble night3 video release

on:
  push:
    branches: [claude/video-assembly-bkhpnj]
    paths: ['video_parts_night3/**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join video parts
        run: |
          cat video_parts_night3/video_night3.part* > my-japan-diary-night-3.mp4
          ls -la my-japan-diary-night-3.mp4

      - name: Publish release with full video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create japan-diary-night-3 my-japan-diary-night-3.mp4 \
            --title "My JAPAN Diary — Night 3 (1 HR)" \
            --notes "Vídeo completo: 60 min, 1080p. Narração termina em ~40:14 (the story ends around 40:14). Baixe my-japan-diary-night-3.mp4 abaixo." \
            --target "${{ github.sha }}" \
          || gh release upload japan-diary-night-3 my-japan-diary-night-3.mp4 --clobber
