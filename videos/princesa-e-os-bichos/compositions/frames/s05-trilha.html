<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  var FID = "s05-trilha";
  var q = function (s) { return document.querySelector(s); };

  var trio    = q("#s05-trilha-trio");
  var liaBob  = q("#s05-trilha-lia-bob");
  var gasHop  = q("#s05-trilha-gaspar-hop");
  var ticoFly = q("#s05-trilha-tico-fly");
  var ticoWing = q("#s05-trilha-tico-fly .wing");
  var liaEyes = q("#s05-trilha-lia-bob .eyes");
  var gasEyes = q("#s05-trilha-gaspar-hop .eyes");
  var ticoEyes = q("#s05-trilha-tico-fly .eyes");

  var forest = q("#s05-trilha-forest");
  var treeL  = q("#s05-trilha-tree-l");
  var treeR  = q("#s05-trilha-tree-r");
  var cloudA = q("#s05-trilha-cloud-a");
  var cloudB = q("#s05-trilha-cloud-b");
  var cloudC = q("#s05-trilha-cloud-c");
  var birds  = q("#s05-trilha-birds");

  var tl = gsap.timeline({ paused: true });

  /* ---------- estados iniciais (herói visível em t=0) ---------- */
  tl.set(trio,   { svgOrigin: "0 0", x: 40, y: 883, scale: 0.46 }, 0);
  tl.set(liaBob, { y: 0, rotation: 0, transformOrigin: "50% 100%" }, 0);
  tl.set(gasHop, { y: 0, rotation: 0, transformOrigin: "50% 100%" }, 0);
  tl.set(ticoFly,{ x: -70, y: -20 }, 0);
  tl.set(ticoWing, { transformOrigin: "18% 78%", rotation: 0 }, 0);
  tl.set(forest, { opacity: 0, y: 30 }, 0);
  tl.set(treeL,  { x: -460 }, 0);
  tl.set(treeR,  { x: 560 }, 0);

  /* ================= CENA 1 (0.0–3.3s) — plano aberto, trio entra pequeno pela esquerda =================
     narrador 0.12–3.26s; ninguém em cena fala, então nenhuma boca se mexe.               */

  /* deriva lenta do céu — vida constante atrás do plano aberto */
  tl.to(cloudA, { x: -74, duration: 9, ease: "none" }, 0);
  tl.to(cloudB, { x: -46, duration: 9, ease: "none" }, 0);
  tl.to(cloudC, { x: -30, duration: 9, ease: "none" }, 0);
  tl.to(birds,  { x: 210, y: -46, duration: 9, ease: "none" }, 0);

  /* ---------- percurso do trio: sobe o leito seco, y diminui e a escala encolhe ---------- */
  tl.to(trio, { x: 180,  y: 870, scale: 0.455, duration: 1.6, ease: "none" }, 0);
  tl.to(trio, { x: 470,  y: 848, scale: 0.440, duration: 1.7, ease: "none" }, 1.6);
  /* ================= CENA 2 (3.3–6.5s) — travessia esquerda → centro-direita, subindo ================= */
  tl.to(trio, { x: 720,  y: 818, scale: 0.420, duration: 1.3, ease: "none" }, 3.3);
  tl.to(trio, { x: 940,  y: 754, scale: 0.390, duration: 1.0, ease: "none" }, 4.6);
  tl.to(trio, { x: 1110, y: 654, scale: 0.355, duration: 0.9, ease: "none" }, 5.6);
  /* ================= CENA 3 (6.5–9.0s) — chegam ao terço direito, menores, e param ================= */
  tl.to(trio, { x: 1250, y: 578, scale: 0.325, duration: 0.8, ease: "none" }, 6.5);
  tl.to(trio, { x: 1350, y: 500, scale: 0.305, duration: 0.9, ease: "power2.out" }, 7.3);

  /* ---------- bob de caminhada da Lia (keyframes explícitos, sem repeat) ---------- */
  var STEP = 0.44, WALK_END = 8.0, t;
  for (t = 0; t < WALK_END; t += STEP) {
    tl.to(liaBob, { y: -11, duration: STEP * 0.5, ease: "sine.out" }, t);
    tl.to(liaBob, { y: 0,   duration: STEP * 0.5, ease: "sine.in"  }, t + STEP * 0.5);
  }

  /* ---------- hops do Gaspar (arco de salto) ---------- */
  var HOP = 0.62;
  for (t = 0.12; t < 7.9; t += HOP) {
    tl.to(gasHop, { y: -48, duration: 0.27, ease: "power2.out" }, t);
    tl.to(gasHop, { y: 0,   duration: 0.27, ease: "power2.in"  }, t + 0.27);
  }

  /* ---------- Tico voa em arcos acima do grupo ---------- */
  var CYC = 1.5;
  for (t = 0; t < 7.5; t += CYC) {
    tl.to(ticoFly, { x: 150, y: -150, duration: CYC * 0.5, ease: "sine.inOut" }, t);
    tl.to(ticoFly, { x: -70, y: -20,  duration: CYC * 0.5, ease: "sine.inOut" }, t + CYC * 0.5);
  }
  /* arco final e pouso no ombro da Lia (batida de chegada) */
  tl.to(ticoFly, { x: 120,  y: -190, duration: 0.75, ease: "sine.inOut" }, 7.5);
  tl.to(ticoFly, { x: -166, y: 172,  duration: 0.68, ease: "power2.inOut" }, 8.25);

  /* ---------- batida de asa (determinística, 2 posições alternadas) ---------- */
  var on = true;
  for (t = 0; t < 8.86; t += 0.14) {
    tl.set(ticoWing, { rotation: on ? -24 : 10 }, t);
    on = !on;
  }
  tl.set(ticoWing, { rotation: 0 }, 8.86);

  /* ---------- piscadas (1–2 por personagem, dessincronizadas) ---------- */
  function blink(el, at) {
    tl.to(el, { scaleY: 0.08, duration: 0.06, ease: "power1.in",  transformOrigin: "50% 50%" }, at);
    tl.to(el, { scaleY: 1,    duration: 0.07, ease: "power1.out", transformOrigin: "50% 50%" }, at + 0.06);
  }
  blink(liaEyes, 2.20);  blink(liaEyes, 6.42);
  blink(gasEyes, 1.35);  blink(gasEyes, 5.08);
  blink(ticoEyes, 3.72); blink(ticoEyes, 7.61);

  /* ---------- sombra do bosque surge à frente deles ---------- */
  tl.to(forest, { opacity: 1, y: 0, duration: 1.15, ease: "power2.out" }, 5.05);

  /* ---------- duas árvores de primeiro plano entram pelas bordas (parallax) ---------- */
  tl.to(treeR, { x: 0, duration: 1.55, ease: "power3.out" }, 6.40);
  tl.to(treeL, { x: 0, duration: 1.35, ease: "power3.out" }, 6.62);
