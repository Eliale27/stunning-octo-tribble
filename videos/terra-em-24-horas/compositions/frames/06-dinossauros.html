  <script>
    (function () {
      // deterministic dial ticks — 24h face, 00 at top
      var g = document.getElementById("06-dinossauros-ticks");
      if (g) {
        for (var i = 0; i < 24; i++) {
          var ang = (i * 15) * Math.PI / 180;
          var major = (i % 6 === 0);
          var rOut = 300;
          var rIn = major ? 262 : 280;
          var x1 = 350 + rIn * Math.sin(ang);
          var y1 = 350 - rIn * Math.cos(ang);
          var x2 = 350 + rOut * Math.sin(ang);
          var y2 = 350 - rOut * Math.cos(ang);
          var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
          ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
          ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
          ln.setAttribute("stroke", i === 0 ? "#E85D26" : "#505048");
          ln.setAttribute("stroke-width", major ? 4 : 2);
          g.appendChild(ln);
        }
      }

      // directional motion-blur proxy for the asteroid streak
      var blurNode = document.getElementById("06-dinossauros-blur");
      var blurProxy = { v: 26 };
      function writeBlur() { blurNode.setAttribute("stdDeviation", blurProxy.v + " 0"); }
      writeBlur(); // seed frame 0

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–2.0): dark register, dial + pointer at ~22:30, silhouettes rise ----
      tl.fromTo("#06-dinossauros-dialstage", { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", transformOrigin: "50% 50%" }, 0.0);
      tl.fromTo("#06-dinossauros-kicker", { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo("#06-dinossauros-rule", { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.32);
      tl.fromTo("#06-dinossauros-pointer", { rotation: 300 },
        { rotation: 337.5, duration: 0.95, ease: "power3.out", transformOrigin: "50% 100%" }, 0.15);
      tl.fromTo("#06-dinossauros-sauropod", { opacity: 0, y: 190 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.6);
      tl.fromTo("#06-dinossauros-theropod", { opacity: 0, y: 210 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.95);
      tl.fromTo("#06-dinossauros-t2230", { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.1);

      // ---- Scene 2 (2.0–3.5): pointer advances to 23:40, orange label lights, ground darkens ----
      tl.to("#06-dinossauros-pointer",
        { rotation: 355, duration: 0.95, ease: "power2.inOut" }, 2.0);
      tl.to("#06-dinossauros-t2230",
        { opacity: 0.22, y: -18, duration: 0.5, ease: "power2.in" }, 2.15); // text-to-text handoff (in place, not an exit)
      tl.fromTo("#06-dinossauros-t2340", { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.35);
      tl.to("#06-dinossauros-darken",
        { opacity: 0.3, duration: 1.0, ease: "power1.inOut" }, 2.2);

      // ---- Scene 3 (3.5–5.184): asteroid streak cuts the dial, bursts, silhouettes gone, held quiet ----
      tl.fromTo("#06-dinossauros-streak", { x: -1080, opacity: 0 },
        { x: 60, opacity: 1, duration: 0.42, ease: "power4.out" }, 3.55);
      tl.to(blurProxy, { v: 0, duration: 0.42, ease: "power4.out", onUpdate: writeBlur }, 3.55);

      // flash — deterministic keyframed opacity burst
      tl.fromTo("#06-dinossauros-flash", { opacity: 0, scale: 0.28 },
        { opacity: 1, scale: 1.0, duration: 0.09, ease: "power2.out", transformOrigin: "50% 50%" }, 3.95);
      tl.to("#06-dinossauros-flash",
        { scale: 1.4, duration: 0.5, ease: "power2.out" }, 4.04);
      tl.to("#06-dinossauros-flash",
        { opacity: 0, duration: 0.42, ease: "power2.in" }, 4.06);

      // hard cut: silhouettes vanish at the flash peak (instant, masked by the burst — not an exit tween)
      tl.set(["#06-dinossauros-sauropod", "#06-dinossauros-theropod"], { opacity: 0 }, 4.02);

      // the disc goes quiet — dim in place, faint scar remains
      tl.to("#06-dinossauros-dialstage", { opacity: 0.5, duration: 0.4, ease: "power2.out" }, 4.08);
      tl.to("#06-dinossauros-streak", { opacity: 0.22, duration: 0.4, ease: "power2.out" }, 4.1);
      tl.to("#06-dinossauros-t2340", { opacity: 0.6, duration: 0.4, ease: "power2.out" }, 4.1);
      // held beat of inevitability to 5.184 (no exit — this is a hard cut)

      window.__timelines["06-dinossauros"] = tl;
    })();
  </script>
