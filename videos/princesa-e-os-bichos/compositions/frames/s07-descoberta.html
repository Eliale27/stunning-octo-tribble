      var ticoEyes   = document.querySelector("#s07-descoberta-bird .eyes");
      var ticoOpen   = document.querySelector("#s07-descoberta-bird .mouth-open");
      var ticoClosed = document.querySelector("#s07-descoberta-bird .mouth-closed");

      var brunoW  = document.querySelector("#s07-descoberta-brunoW");
      var brunoCh = document.querySelector("#s07-descoberta-brunoCh");
      var brunoEyes = document.querySelector("#s07-descoberta-brunoCh .eyes");
      var liaW    = document.querySelector("#s07-descoberta-liaW");
      var liaCh   = document.querySelector("#s07-descoberta-liaCh");
      var liaEyes = document.querySelector("#s07-descoberta-liaCh .eyes");
      var gasW    = document.querySelector("#s07-descoberta-gasparW");
      var gasCh   = document.querySelector("#s07-descoberta-gasparCh");
      var gasEyes = document.querySelector("#s07-descoberta-gasparCh .eyes");

      var b1 = document.querySelector("#s07-descoberta-b1");

      var tl = gsap.timeline({ paused: true });

      /* ---------- estado inicial (t = 0) ---------- */
      tl.set(shake, { x: 0, y: 0 }, 0);
      tl.set(water, { y: 600 }, 0);
      tl.set(crests, { x: 0 }, 0);
      tl.set(lwall, { x: -660 }, 0);
      tl.set(rwall, { x:  660 }, 0);
      tl.set(floor, { y: 300 }, 0);
      tl.set(log,   { y: -840, rotation: -8, svgOrigin: "0 0" }, 0);
      tl.set(s1, { scale: 0, svgOrigin: "940 850" }, 0);
      tl.set(s2, { scale: 0, svgOrigin: "740 890" }, 0);
      tl.set(s3, { scale: 0, svgOrigin: "1160 880" }, 0);
      tl.set(s4, { scale: 0, svgOrigin: "1046 762" }, 0);
      tl.set(s5, { scale: 0, svgOrigin: "822 770" }, 0);
      tl.set([g1, g2, g3], { scale: 0, rotation: -25, svgOrigin: "0 0" }, 0);
      tl.set(f1, { opacity: 0, scale: 0.2, svgOrigin: "720 548" }, 0);
      tl.set(f2, { opacity: 0, scale: 0.2, svgOrigin: "965 532" }, 0);
      tl.set(f3, { opacity: 0, scale: 0.2, svgOrigin: "1205 550" }, 0);

      tl.set(tilt, { rotation: 0, svgOrigin: "70 66" }, 0);
      tl.set(wing, { rotation: 0, svgOrigin: "64 57" }, 0);
      tl.set(ticoEyes,   { scaleY: 1, x: 0, y: 0 }, 0);
      tl.set(ticoOpen,   { opacity: 0 }, 0);
      tl.set(ticoClosed, { opacity: 1 }, 0);

      tl.set(brunoW, { x: -560, y: 0 }, 0);
      tl.set(liaW,   { x: -560, y: 0 }, 0);
      tl.set(gasW,   { x: -560, y: 0 }, 0);
      tl.set(brunoCh, { rotation: 0, svgOrigin: "117 284" }, 0);
      tl.set(liaCh,   { rotation: 0, svgOrigin: "110 300" }, 0);
      tl.set(gasCh,   { rotation: 0, svgOrigin: "88 137" }, 0);
      tl.set([brunoEyes, liaEyes, gasEyes], { scaleY: 1, y: 0 }, 0);

      tl.set(b1, { opacity: 0, scale: 0.5, transformOrigin: "44px 128px" }, 0);

      /* ---------- receitas ---------- */
      function speak(openEl, closedEl, start, end) {
        var t = start, on = true, FLAP = 0.0625;
        while (t < end - 0.001) {
          tl.set(openEl,   { opacity: on ? 1 : 0 }, t);
          tl.set(closedEl, { opacity: on ? 0 : 1 }, t);
          on = !on;
          t += FLAP;
        }
        tl.set(openEl,   { opacity: 0 }, end);
        tl.set(closedEl, { opacity: 1 }, end);
      }
      function blink(eyes, t) {
        tl.to(eyes, { scaleY: 0.1, duration: 0.06 }, t);
        tl.to(eyes, { scaleY: 1,   duration: 0.06 }, t + 0.06);
      }

      /* =========================================================
         CENA 1 (0.0–1.7s) — Tico voa alto no canto superior
         esquerdo e aponta para baixo. "ali embaixo!"
         ========================================================= */

      tl.fromTo(fly, { x: -300, y: -70 },
                     { x: 0, y: 0, duration: 0.45, ease: "power2.out" }, 0);

      /* asa batendo — ele fica pairando quase a cena toda */
      (function () {
        var t = 0.00, up = true, WD = 0.11;
        while (t < 8.75) {
          tl.to(wing, { rotation: up ? -34 : 20, duration: WD, ease: "sine.inOut" }, t);
          up = !up;
          t += WD;
        }
      })();
      tl.to(wing, { rotation: 0, duration: 0.22, ease: "sine.out" }, 8.75);

      /* bico aponta para baixo + duas mergulhadas de ênfase */
      tl.to(tilt, { rotation: 26, duration: 0.32, ease: "back.out(1.7)" }, 0.45);
      tl.to(fly, { y: 16, duration: 0.16, ease: "power2.out" }, 0.85);
      tl.to(fly, { y: 0,  duration: 0.20, ease: "power1.inOut" }, 1.01);
      tl.to(fly, { y: 16, duration: 0.16, ease: "power2.out" }, 1.28);
      tl.to(fly, { y: 0,  duration: 0.20, ease: "power1.inOut" }, 1.44);

      speak(ticoOpen, ticoClosed, 0.12, 1.61);
      tl.fromTo(b1, { opacity: 0, scale: 0.5 },
                    { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.4)" }, 0.12);
      tl.to(b1, { opacity: 0, scale: 0.55, duration: 0.16, ease: "power2.in" }, 1.45);

      /* =========================================================
         CENA 2 (1.7–5.0s) — revela-se a garganta: paredes,
         depois o tronco, as pedras e os galhos (escalonados).
         ========================================================= */

      tl.to(lwall, { x: 0, duration: 0.75, ease: "power3.out" }, 1.70);
      tl.to(rwall, { x: 0, duration: 0.70, ease: "power3.out" }, 1.84);
      tl.to(floor, { y: 0, duration: 0.60, ease: "power3.out" }, 1.96);

      /* Tico recolhe o bico e observa */
      tl.to(tilt, { rotation: 8, duration: 0.40, ease: "power2.inOut" }, 2.05);
      blink(ticoEyes, 2.40);

      /* o TRONCO despenca e trava a passagem */
      tl.to(log, { y: 0, duration: 0.50, ease: "power2.in" }, 2.45);
      tl.to(log, { rotation: -3, duration: 0.35, ease: "back.out(2)" }, 2.95);
      tl.to(log, { y: -14, duration: 0.12, ease: "power2.out" }, 2.97);
      tl.to(log, { y: 0,   duration: 0.14, ease: "power2.in" },  3.09);

      /* impacto — a garganta treme */
      tl.to(shake, { x: 7,  y: 6, duration: 0.06, ease: "power1.out" }, 2.95);
      tl.to(shake, { x: -5, y: 0, duration: 0.07, ease: "power1.inOut" }, 3.01);
      tl.to(shake, { x: 3,  duration: 0.06, ease: "power1.inOut" }, 3.08);
      tl.to(shake, { x: 0,  duration: 0.08, ease: "power1.out" }, 3.14);

      /* Tico se assusta com a queda e sobe um pouco */
      tl.to(fly, { y: -30, duration: 0.18, ease: "power2.out" }, 2.95);
      tl.to(fly, { y: 0,   duration: 0.50, ease: "power1.inOut" }, 3.35);

      /* as PEDRAS se encaixam, uma a uma */
      tl.to(s2, { scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 3.55);
      tl.to(s3, { scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 3.72);
      tl.to(s1, { scale: 1, duration: 0.38, ease: "back.out(1.8)" }, 3.90);
      tl.to(s5, { scale: 1, duration: 0.32, ease: "back.out(1.8)" }, 4.08);
      tl.to(s4, { scale: 1, duration: 0.32, ease: "back.out(1.8)" }, 4.22);

      /* os GALHOS brotam da barreira */
      tl.to(g1, { scale: 1, rotation: 0, duration: 0.40, ease: "back.out(1.9)" }, 4.45);
      tl.to(g2, { scale: 1, rotation: 0, duration: 0.40, ease: "back.out(1.9)" }, 4.62);
      tl.to(g3, { scale: 1, rotation: 0, duration: 0.36, ease: "back.out(1.9)" }, 4.80);

      /* Tico deriva para o lado, acompanhando a barreira */
      tl.to(fly, { x: 130, duration: 1.2, ease: "sine.inOut" }, 4.00);

      /* =========================================================
         CENA 3 (5.0–7.1s) — a água represada sobe atrás do
         tronco e pulsa UMA vez contra a barreira.
         ========================================================= */

      tl.to(water, { y: 0, duration: 1.05, ease: "power2.out" }, 5.00);
      tl.to(tilt, { rotation: 20, duration: 0.35, ease: "power2.out" }, 5.15);
      tl.to(fly, { y: 12, duration: 0.65, ease: "sine.inOut" }, 5.20);
      tl.to(fly, { y: 0,  duration: 0.65, ease: "sine.inOut" }, 5.85);

      /* o pulso: a água empurra, o tronco range, espuma salta */
      tl.to(water, { y: -16, duration: 0.22, ease: "power2.out" }, 6.25);
      tl.to(water, { y: 0,   duration: 0.55, ease: "sine.inOut" }, 6.50);
      tl.to(log, { x: 9, rotation: -1.6, duration: 0.18, ease: "power2.out" }, 6.28);
      tl.to(log, { x: 0, rotation: -3,   duration: 0.45, ease: "power1.inOut" }, 6.50);
      tl.to(s1, { x: 5, duration: 0.16, ease: "power2.out" }, 6.30);
      tl.to(s1, { x: 0, duration: 0.35, ease: "power1.inOut" }, 6.50);
      tl.to(s4, { rotation: 4, svgOrigin: "1046 762", duration: 0.16, ease: "power2.out" }, 6.32);
      tl.to(s4, { rotation: 0, duration: 0.35, ease: "power1.inOut" }, 6.52);

      tl.to(f1, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2.5)" }, 6.26);
      tl.to(f2, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2.5)" }, 6.33);
      tl.to(f3, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2.5)" }, 6.40);
      tl.to([f1, f2, f3], { opacity: 0, duration: 0.30, ease: "power1.in" }, 6.95);

      /* Tico recua no susto do pulso */
      tl.to(fly, { y: -22, duration: 0.20, ease: "power2.out" }, 6.32);
      tl.to(fly, { y: 0,   duration: 0.50, ease: "power1.inOut" }, 6.62);

      /* cristas da água inquietas até o fim */
      tl.to(crests, { x: 22, duration: 1.3, ease: "sine.inOut" }, 6.10);
      tl.to(crests, { x: 0,  duration: 1.3, ease: "sine.inOut" }, 7.40);
      tl.to(crests, { x: 18, duration: 1.3, ease: "sine.inOut" }, 8.70);

      /* =========================================================
         CENA 4 (7.1–10.0s) — o grupo chega na borda inferior,
         minúsculo diante do obstáculo, e olha para cima.
         ========================================================= */

      /* caminhada de entrada */
      tl.to(liaW,   { x: 0, duration: 1.10, ease: "power1.inOut" }, 7.02);
      tl.to(brunoW, { x: 0, duration: 1.20, ease: "power1.inOut" }, 7.10);
      tl.to(gasW,   { x: 0, duration: 1.20, ease: "power1.inOut" }, 7.15);

      /* bob de passo da Lia */
      (function () {
        var t = 7.02, up = true;
        while (t < 7.98) {
          tl.to(liaW, { y: up ? -7 : 0, duration: 0.14, ease: "sine.inOut" }, t);
          up = !up;
          t += 0.14;
        }
        tl.to(liaW, { y: 0, duration: 0.14, ease: "sine.out" }, 7.98);
      })();
      /* passo pesado do Bruno */
      (function () {
        var t = 7.10, up = true;
        while (t < 8.14) {
          tl.to(brunoW, { y: up ? -5 : 0, duration: 0.19, ease: "sine.inOut" }, t);
          up = !up;
          t += 0.19;
        }
        tl.to(brunoW, { y: 0, duration: 0.16, ease: "sine.out" }, 8.14);
      })();
      /* Gaspar vem aos pulos */
      tl.to(gasW, { y: -32, duration: 0.15, ease: "power1.out" }, 7.15);
      tl.to(gasW, { y: 0,   duration: 0.15, ease: "power1.in"  }, 7.30);
      tl.to(gasW, { y: -32, duration: 0.15, ease: "power1.out" }, 7.46);
      tl.to(gasW, { y: 0,   duration: 0.15, ease: "power1.in"  }, 7.61);
      tl.to(gasW, { y: -32, duration: 0.15, ease: "power1.out" }, 7.77);
      tl.to(gasW, { y: 0,   duration: 0.15, ease: "power1.in"  }, 7.92);
      tl.to(gasW, { y: -26, duration: 0.14, ease: "power1.out" }, 8.08);
      tl.to(gasW, { y: 0,   duration: 0.14, ease: "power1.in"  }, 8.22);

      /* eles olham PARA CIMA — contraste de escala */
      tl.to(liaCh,   { rotation: -5, duration: 0.50, ease: "power2.out" }, 8.42);
      tl.to(gasCh,   { rotation: -7, duration: 0.45, ease: "power2.out" }, 8.50);
      tl.to(brunoCh, { rotation: -4, duration: 0.55, ease: "power2.out" }, 8.58);
      tl.to(liaEyes,   { y: -4, duration: 0.30, ease: "power2.out" }, 8.52);
      tl.to(gasEyes,   { y: -5, duration: 0.30, ease: "power2.out" }, 8.58);
      tl.to(brunoEyes, { y: -4, duration: 0.30, ease: "power2.out" }, 8.66);

      /* Tico desce em arco e pousa na pedra ao lado do grupo */
      tl.to(tilt, { rotation: 0, duration: 0.30, ease: "power2.inOut" }, 7.45);
      tl.to(fly, { x: 300, y: 300, duration: 0.65, ease: "power1.in" }, 7.50);
      tl.to(fly, { x: 452, y: 560, duration: 0.55, ease: "power1.inOut" }, 8.15);
      tl.to(fly, { x: 420, y: 666, duration: 0.35, ease: "power2.out" }, 8.70);
      tl.to(fly, { y: 660, duration: 0.10, ease: "power1.out" }, 9.05);
      tl.to(fly, { y: 666, duration: 0.14, ease: "power1.in" },  9.15);

      /* Tico também olha para cima */
      tl.to(tilt, { rotation: -16, duration: 0.40, ease: "power2.out" }, 9.30);

      /* piscadas dessincronizadas — o quadro nunca congela */
      blink(liaEyes,   8.95);
      blink(brunoEyes, 9.25);
      blink(gasEyes,   9.50);
      blink(ticoEyes,  9.70);

      /* Gaspar dá um pulinho de espanto no fim */
      tl.to(gasW, { y: -18, duration: 0.14, ease: "power1.out" }, 9.55);
      tl.to(gasW, { y: 0,   duration: 0.16, ease: "power1.in" },  9.69);

      window.__timelines = window.__timelines || {};
      window.__timelines["s07-descoberta"] = tl;
    })();
  </script>
