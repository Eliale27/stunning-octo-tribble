  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "s02-rio-parou";

      var cloudA = document.getElementById("s02-cloud-a");
      var cloudB = document.getElementById("s02-cloud-b");
      var cloudC = document.getElementById("s02-cloud-c");
      var crack1 = document.getElementById("s02-crack-1");
      var crack2 = document.getElementById("s02-crack-2");
      var walk   = document.getElementById("s02-lia-walk");
      var bob    = document.getElementById("s02-lia-bob");
      var tilt   = document.getElementById("s02-lia-tilt");
      var bodyG  = document.getElementById("s02-lia-body");
      var dust   = document.getElementById("s02-dust");
      var bubble = document.getElementById("s02-bubble");

      var armR        = bodyG.querySelector(".arm-r");
      var eyes        = bodyG.querySelector(".eyes");
      var mouthOpen   = bodyG.querySelector(".mouth-open");
      var mouthClosed = bodyG.querySelector(".mouth-closed");

      var FEET = "110 310";      // origem no chão, sob os pés da Lia
      var HEAD = "110 86";       // origem na altura dos olhos
      var SHLD = "146 138";      // ombro direito (topo do braço)

      var tl = gsap.timeline({ paused: true });

      /* ---------- estado inicial (determinístico) ---------- */
      tl.set(walk,  { x: -560 }, 0);
      tl.set(bob,   { y: 0 }, 0);
      tl.set(tilt,  { rotation: 0, svgOrigin: FEET }, 0);
      tl.set(bodyG, { y: 0, scaleX: 1, scaleY: 1, svgOrigin: FEET }, 0);
      tl.set(armR,  { rotation: 0, svgOrigin: SHLD }, 0);
      tl.set(eyes,  { y: 0, scaleY: 1, svgOrigin: HEAD }, 0);
      tl.set(mouthOpen,   { opacity: 0 }, 0);
      tl.set(mouthClosed, { opacity: 1 }, 0);
      tl.set(dust,   { opacity: 0 }, 0);
      tl.set(bubble, { opacity: 0 }, 0);

      /* ---------- Cena 1 (0.0–2.8s) — o vale parado, só a nuvem e o leito rachando ---------- */
      tl.fromTo(cloudA, { x: 0 }, { x: 78, duration: 9, ease: "none" }, 0);
      tl.fromTo(cloudB, { x: 0 }, { x: 52, duration: 9, ease: "none" }, 0);
      tl.fromTo(cloudC, { x: 0 }, { x: 96, duration: 9, ease: "none" }, 0);

      tl.set(crack1, { strokeDasharray: 240, strokeDashoffset: 240 }, 0);
      tl.to(crack1,  { strokeDashoffset: 0, duration: 1.45, ease: "power1.out" }, 0.85);
      tl.set(crack2, { strokeDasharray: 200, strokeDashoffset: 200 }, 0);
      tl.to(crack2,  { strokeDashoffset: 0, duration: 1.30, ease: "power1.out" }, 1.40);

      /* ---------- Cena 2 (2.8–5.8s) — Lia entra andando, para e fala ---------- */
      // caminhada: percurso constante + freada curta ao chegar no terço esquerdo
      tl.to(walk, { x: -40, duration: 0.70, ease: "none" }, 2.15);
      tl.to(walk, { x: 0,   duration: 0.20, ease: "power2.out" }, 2.85);

      // bob de caminhada — 5 passos, ±6px em tela (5 unidades locais × 1.25)
      for (var i = 0; i < 5; i++) {
        var t0 = 2.15 + i * 0.18;
        tl.to(bob, { y: -5, duration: 0.09, ease: "sine.out" }, t0);
        tl.to(bob, { y: 0,  duration: 0.09, ease: "sine.in"  }, t0 + 0.09);
      }
      // leve inclinação para a frente enquanto anda, e endireita ao parar
      tl.to(tilt, { rotation: 4, duration: 0.30, ease: "sine.out",   svgOrigin: FEET }, 2.15);
      tl.to(tilt, { rotation: 0, duration: 0.32, ease: "power2.out", svgOrigin: FEET }, 2.76);

      // balão em spring-pop (nasce na ponta do rabicho, junto da boca)
      tl.fromTo(bubble,
        { opacity: 0, scale: 0.55, svgOrigin: "676 456" },
        { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.4)" }, 3.09);
      tl.to(bubble, { opacity: 0, scale: 0.72, duration: 0.20, ease: "back.in(1.4)", svgOrigin: "676 456" }, 5.80);

      // lip flap 8 Hz — janela de fala da Lia (dialogue_cues: 3.087 → 5.796)
      var START = 3.087, END = 5.796, FLAP = 0.0625;
      var on = true, t = START;
      while (t < END) {
        tl.set(mouthOpen,   { opacity: on ? 1 : 0 }, t);
        tl.set(mouthClosed, { opacity: on ? 0 : 1 }, t);
        on = !on; t += FLAP;
      }
      tl.set(mouthOpen,   { opacity: 0 }, END);
      tl.set(mouthClosed, { opacity: 1 }, END);

      /* ---------- piscadas (dessincronizadas) ---------- */
      function blink(at) {
        tl.to(eyes, { scaleY: 0.1, duration: 0.06, ease: "power2.in",  svgOrigin: HEAD }, at);
        tl.to(eyes, { scaleY: 1,   duration: 0.06, ease: "power2.out", svgOrigin: HEAD }, at + 0.06);
      }
      blink(3.55);
      blink(8.42);

      /* ---------- Cena 3 (5.8–9.0s) — agacha, toca o chão seco, olha a montanha ---------- */
      // agachamento (peso desce sobre os pés)
      tl.to(bodyG, { y: 34, scaleY: 0.84, scaleX: 1.04, duration: 0.62, ease: "power2.inOut", svgOrigin: FEET }, 5.92);
      tl.to(tilt,  { rotation: 6, duration: 0.62, ease: "power2.inOut", svgOrigin: FEET }, 5.92);
      // braço direito desce e toca a terra
      tl.to(armR,  { rotation: 30, duration: 0.55, ease: "power2.out", svgOrigin: SHLD }, 6.02);

      // poeirinha no toque
      tl.fromTo(dust,
        { opacity: 0, scale: 0.5, y: 0, svgOrigin: "654 748" },
        { opacity: 0.95, scale: 1.15, y: -6, duration: 0.26, ease: "back.out(2)" }, 6.45);
      tl.to(dust, { opacity: 0, scale: 1.5, y: -26, duration: 0.60, ease: "power1.out", svgOrigin: "654 748" }, 6.76);

      // ela levanta o olhar para a montanha (corpo inclina para trás, olhos sobem)
      tl.to(tilt, { rotation: -8, duration: 0.65, ease: "power2.inOut", svgOrigin: FEET }, 6.95);
      tl.to(armR, { rotation: 22, duration: 0.50, ease: "power2.inOut", svgOrigin: SHLD }, 6.98);
      tl.to(eyes, { y: -3, duration: 0.40, ease: "power2.out", svgOrigin: HEAD }, 7.06);

      // batida de reação — o olhar se aprofunda e os ombros sobem devagar
      tl.to(tilt,  { rotation: -9.6, duration: 0.70, ease: "sine.inOut", svgOrigin: FEET }, 7.72);
      tl.to(bodyG, { y: 29, scaleY: 0.865, duration: 0.90, ease: "sine.inOut", svgOrigin: FEET }, 7.82);
      tl.to(tilt,  { rotation: -8.5, duration: 0.62, ease: "sine.inOut", svgOrigin: FEET }, 8.38);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
