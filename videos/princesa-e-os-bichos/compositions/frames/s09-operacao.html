      /* ---------- receita de lip flap (8 Hz, determinística) ---------- */
      function speak(openEl, closedEl, start, end) {
        var t = start, on = true, FLAP = 0.0625;
        while (t < end - 0.001) {

          tl.set(closedEl, { opacity: on ? 0 : 1 }, t);
          on = !on;
          t += FLAP;

        tl.set(openEl,   { opacity: 0 }, end);
        tl.set(closedEl, { opacity: 1 }, end);
      }

      function puff(el, t, s) {

      tl.to(liaG,    { rotation: -2.5, duration: 0.3, ease: "power2.out" }, 2.25);
