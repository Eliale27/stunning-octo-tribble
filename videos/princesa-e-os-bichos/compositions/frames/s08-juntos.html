      var ticoClosed = document.querySelector("#s08-juntos-bird .mouth-closed");

      /* Gaspar */
      var gaspar     = document.querySelector("#s08-juntos-gaspar");
      var gaspIn     = document.querySelector("#s08-juntos-gaspin");
      var gaspBody   = document.querySelector("#s08-juntos-gaspin .body");
      var gaspEyes   = document.querySelector("#s08-juntos-gaspin .eyes");
      var gaspOpen   = document.querySelector("#s08-juntos-gaspin .mouth-open");
      var gaspClosed = document.querySelector("#s08-juntos-gaspin .mouth-closed");

      /* Lia */
      var lia       = document.querySelector("#s08-juntos-lia");
      var liaArmR   = document.querySelector("#s08-juntos-lia .arm-r");
      var liaEyes   = document.querySelector("#s08-juntos-lia .eyes");
      var liaOpen   = document.querySelector("#s08-juntos-lia .mouth-open");
      var liaClosed = document.querySelector("#s08-juntos-lia .mouth-closed");

      /* cenário / destaques */
      var log     = document.querySelector("#s08-juntos-log");
      var creak1  = document.querySelector("#s08-juntos-creak1");
      var creak2  = document.querySelector("#s08-juntos-creak2");
      var ring    = document.querySelector("#s08-juntos-ring");
      var ringStar= document.querySelector("#s08-juntos-ringstar");
      var star    = document.querySelector("#s08-juntos-star");
      var cloudA  = document.querySelector("#s08-juntos-cloudA");
      var cloudB  = document.querySelector("#s08-juntos-cloudB");

      var b1 = document.querySelector("#s08-juntos-b1");
      var b2 = document.querySelector("#s08-juntos-b2");
      var b3 = document.querySelector("#s08-juntos-b3");
      var b4 = document.querySelector("#s08-juntos-b4");

      var tl = gsap.timeline({ paused: true });

      /* ---------- estado inicial (t = 0) ---------- */
      tl.set(bruno,       { x: 0, y: 0, rotation: 0, svgOrigin: "640 885" }, 0);
      tl.set(brunoBody,   { scaleY: 1, svgOrigin: "117 254" }, 0);
      tl.set(brunoEyes,   { x: 0, y: 0, scaleY: 1 }, 0);
      tl.set(brunoOpen,   { opacity: 0 }, 0);
      tl.set(brunoClosed, { opacity: 1 }, 0);

      tl.set(fly,        { x: 0, y: 0 }, 0);
      tl.set(tilt,       { rotation: 0, svgOrigin: "70 88" }, 0);
      tl.set(bird,       { scaleX: -1, svgOrigin: "70 66" }, 0);
      tl.set(wing,       { rotation: 0, svgOrigin: "64 57" }, 0);
      tl.set(ticoEyes,   { x: 0, scaleY: 1 }, 0);
      tl.set(ticoOpen,   { opacity: 0 }, 0);
      tl.set(ticoClosed, { opacity: 1 }, 0);

      tl.set(gaspar,     { x: 0, y: 0 }, 0);
      tl.set(gaspIn,     { scaleX: 1, scaleY: 1, rotation: 0, svgOrigin: "88 130" }, 0);
      tl.set(gaspBody,   { scaleY: 1, svgOrigin: "88 136" }, 0);
      tl.set(gaspEyes,   { x: 0, y: 0, scaleY: 1 }, 0);
      tl.set(gaspOpen,   { opacity: 0 }, 0);
      tl.set(gaspClosed, { opacity: 1 }, 0);

      tl.set(lia,       { y: 0 }, 0);
      tl.set(liaArmR,   { rotation: 0, svgOrigin: "146 142" }, 0);
      tl.set(liaEyes,   { x: 0, y: 0, scaleY: 1 }, 0);
      tl.set(liaOpen,   { opacity: 0 }, 0);
      tl.set(liaClosed, { opacity: 1 }, 0);

      tl.set(log,    { rotation: 0, x: 0, svgOrigin: "340 645" }, 0);
      tl.set(creak1, { opacity: 0 }, 0);
      tl.set(creak2, { opacity: 0 }, 0);
      tl.set(ring,     { opacity: 0, scale: 0.6, svgOrigin: "330 690" }, 0);
      tl.set(ringStar, { opacity: 0, scale: 0.4, svgOrigin: "0 0" }, 0);
      tl.set(star,     { opacity: 0, scale: 0.3, svgOrigin: "0 0" }, 0);
      tl.set(cloudA, { x: 0 }, 0);
      tl.set(cloudB, { x: 0 }, 0);
      tl.set([b1, b2, b3, b4], { opacity: 0, scale: 0.5, x: 0, y: 0, transformOrigin: "76px 170px" }, 0);

      /* ---------- receitas ---------- */
      function speak(openEl, closedEl, start, end) {
        var t = start, on = true, FLAP = 0.0625; /* 8 Hz */
        while (t < end - 0.001) {
          tl.set(openEl,   { opacity: on ? 1 : 0 }, t);
          tl.set(closedEl, { opacity: on ? 0 : 1 }, t);
          on = !on;
          t += FLAP;
        }
        tl.set(openEl,   { opacity: 0 }, end);
        tl.set(closedEl, { opacity: 1 }, end);
      }
      function blink(eyesEl, t) {
        tl.to(eyesEl, { scaleY: 0.1, duration: 0.06 }, t);
        tl.to(eyesEl, { scaleY: 1,   duration: 0.06 }, t + 0.06);
      }

      /* =========================================================
         CENA 1 (0.0–3.5s) — Bruno fala e empurra o tronco com o
         ombro; o tronco range mas não cede.
         ========================================================= */

      speak(brunoOpen, brunoClosed, 0.12, 3.48);
      tl.fromTo(b1, { opacity: 0, scale: 0.5 },
                    { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.4)" }, 0.12);
      tl.to(b1, { y: -8, duration: 0.85, ease: "sine.inOut" }, 1.00);
      tl.to(b1, { y:  0, duration: 0.85, ease: "sine.inOut" }, 1.85);
      tl.to(b1, { opacity: 0, scale: 0.55, duration: 0.16, ease: "power2.in" }, 3.32);

      /* investida 1 */
      tl.to(bruno, { x: -20, rotation: -5, duration: 0.35, ease: "power1.inOut" }, 0.45);
      tl.to(bruno, { x: -34, rotation: -11, duration: 0.18, ease: "power3.in" }, 0.85);
      tl.to(log, { rotation: -1.2, x: -3, duration: 0.09, ease: "power2.out" }, 1.03);
      tl.to(log, { rotation:  0.5, x:  2, duration: 0.12, ease: "power1.inOut" }, 1.12);
      tl.to(log, { rotation:  0,   x:  0, duration: 0.16, ease: "power1.out" }, 1.24);
      tl.fromTo(creak1, { opacity: 0 }, { opacity: 1, duration: 0.10 }, 1.03);
      tl.to(creak1, { opacity: 0, duration: 0.15 }, 1.35);
      tl.to(bruno, { x: -24, rotation: -6, duration: 0.30, ease: "power2.out" }, 1.45);

      /* investida 2 — mais forte, e nada */
      tl.to(bruno, { x: -38, rotation: -12.5, duration: 0.20, ease: "power3.in" }, 2.05);
      tl.to(log, { rotation: -1.8, x: -4, duration: 0.09, ease: "power2.out" }, 2.25);
      tl.to(log, { rotation:  0.7, x:  3, duration: 0.12, ease: "power1.inOut" }, 2.34);
      tl.to(log, { rotation:  0,   x:  0, duration: 0.18, ease: "power1.out" }, 2.46);
      tl.fromTo(creak2, { opacity: 0 }, { opacity: 1, duration: 0.10 }, 2.25);
      tl.to(creak2, { opacity: 0, duration: 0.15 }, 2.60);

      /* Bruno desiste, dá um passo atrás e bufa */
      tl.to(bruno, { x: 0, rotation: 0, duration: 0.55, ease: "power2.inOut" }, 2.70);
      tl.to(brunoBody, { scaleY: 1.05, duration: 0.18, ease: "sine.inOut" }, 3.15);
      tl.to(brunoBody, { scaleY: 1.00, duration: 0.20, ease: "sine.inOut" }, 3.33);
      blink(brunoEyes, 1.80);

      /* os outros acompanham a investida */
      tl.to(liaEyes,  { x: -4, duration: 0.28, ease: "power2.out" }, 0.50);
      tl.to(gaspEyes, { x: -5, duration: 0.28, ease: "power2.out" }, 0.60);
      tl.to(gaspBody, { scaleY: 1.05, duration: 0.20, ease: "sine.inOut" }, 1.50);
      tl.to(gaspBody, { scaleY: 1.00, duration: 0.24, ease: "sine.inOut" }, 1.70);
      tl.to(gaspBody, { scaleY: 1.05, duration: 0.20, ease: "sine.inOut" }, 2.90);
      tl.to(gaspBody, { scaleY: 1.00, duration: 0.24, ease: "sine.inOut" }, 3.10);
      blink(gaspEyes, 2.70);

      /* =========================================================
         CENA 2 (3.5–6.4s) — Tico sobe, circula sobre o tronco e o
         destaque butter pisca sobre a pedra-chave.
         ========================================================= */

      /* voo */
      tl.to(fly, { x:  -60, y: -120, duration: 0.40, ease: "power1.out" },   3.55);
      tl.to(fly, { x: -260, y: -240, duration: 0.45, ease: "power1.inOut" }, 3.95);
      tl.to(fly, { x: -500, y: -180, duration: 0.45, ease: "power1.inOut" }, 4.40);
      tl.to(fly, { x: -560, y: -300, duration: 0.40, ease: "power1.inOut" }, 4.85);
      tl.to(fly, { x: -380, y: -360, duration: 0.40, ease: "power1.inOut" }, 5.25);
      tl.to(fly, { x: -240, y: -260, duration: 0.40, ease: "power1.inOut" }, 5.65);
      tl.to(fly, { x: -470, y: -230, duration: 0.45, ease: "power1.inOut" }, 6.05);
      tl.to(fly, { y: -244, duration: 0.25, ease: "sine.inOut" }, 6.55);
      tl.to(fly, { y: -230, duration: 0.25, ease: "sine.inOut" }, 6.80);

      /* asa batendo durante o voo */
      (function () {
        var t = 3.55, up = true, WD = 0.105;
        while (t < 7.55) {
          tl.to(wing, { rotation: up ? -34 : 20, duration: WD, ease: "sine.inOut" }, t);
          up = !up;
          t += WD;
        }
      })();
      tl.to(wing, { rotation: 0, duration: 0.20, ease: "sine.out" }, 7.62);

      /* ele olha para baixo, mirando o encaixe */
      tl.to(tilt, { rotation: 12, duration: 0.30, ease: "power2.out" }, 6.10);

      speak(ticoOpen, ticoClosed, 3.77, 6.31);
      tl.fromTo(b2, { opacity: 0, scale: 0.5 },
                    { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.4)" }, 3.77);
      tl.to(b2, { y: -8, duration: 0.80, ease: "sine.inOut" }, 4.30);
      tl.to(b2, { y:  0, duration: 0.80, ease: "sine.inOut" }, 5.10);
      tl.to(b2, { opacity: 0, scale: 0.55, duration: 0.16, ease: "power2.in" }, 6.15);

      /* o destaque butter pisca sobre a pedra-chave */
      tl.fromTo(ring, { opacity: 0, scale: 0.6 },
                      { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.4)" }, 4.90);
      tl.to(ring, { opacity: 0.25, duration: 0.12 }, 5.30);
      tl.to(ring, { opacity: 1,    duration: 0.12 }, 5.45);
      tl.to(ring, { opacity: 0.25, duration: 0.12 }, 5.75);
      tl.to(ring, { opacity: 1,    duration: 0.12 }, 5.90);
      tl.to(ring, { opacity: 0,    duration: 0.30 }, 6.45);
      tl.fromTo(ringStar, { opacity: 0, scale: 0.4 },
                          { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.6)" }, 5.05);
      tl.to(ringStar, { opacity: 0, scale: 0.5, duration: 0.25, ease: "power2.in" }, 6.45);

      /* todo mundo olha para cima */
      tl.to(brunoEyes, { x: -3, y: -3, duration: 0.28, ease: "power2.out" }, 4.10);
      tl.to(liaEyes,   { x: -2, y: -3, duration: 0.28, ease: "power2.out" }, 4.20);
      tl.to(gaspEyes,  { y: -3, duration: 0.28, ease: "power2.out" }, 4.30);
      blink(liaEyes, 4.60);

      /* pouso de volta no galho */
      tl.to(fly, { x: -180, y: -90, duration: 0.35, ease: "power1.inOut" }, 7.15);
      tl.to(bird, { scaleX: 1, duration: 0.20, ease: "power2.inOut" }, 7.20);
      tl.to(tilt, { rotation: 0, duration: 0.25, ease: "power2.out" }, 7.20);
      tl.to(fly, { x: 0, y: -8, duration: 0.30, ease: "power1.in" }, 7.50);
      tl.to(fly, { y: 0, duration: 0.20, ease: "back.out(2)" }, 7.80);
      tl.to(bird, { scaleX: -1, duration: 0.20, ease: "power2.inOut" }, 8.05);

      /* =========================================================
         CENA 3 (6.4–9.0s) — Gaspar fala saltando até a fresta e
         se espreme nela: a escala vai a zero na fenda.
         ========================================================= */

      speak(gaspOpen, gaspClosed, 6.61, 8.97);
      tl.fromTo(b3, { opacity: 0, scale: 0.5 },
                    { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.4)" }, 6.61);
      tl.to(b3, { y: -8, duration: 0.70, ease: "sine.inOut" }, 7.10);
      tl.to(b3, { y:  0, duration: 0.70, ease: "sine.inOut" }, 7.80);
      tl.to(b3, { opacity: 0, scale: 0.55, duration: 0.16, ease: "power2.in" }, 8.81);

      /* três saltos até a fresta */
      tl.to(gaspar, { x: -210, duration: 0.40, ease: "none" }, 6.55);
      tl.to(gaspar, { y: -85, duration: 0.20, ease: "power1.out" }, 6.55);
      tl.to(gaspar, { y:   0, duration: 0.20, ease: "power1.in" },  6.75);
      tl.to(gaspIn, { scaleY: 0.92, duration: 0.08, ease: "power1.out" }, 6.95);
      tl.to(gaspIn, { scaleY: 1.00, duration: 0.12, ease: "power1.inOut" }, 7.03);

      tl.to(gaspar, { x: -420, duration: 0.40, ease: "none" }, 7.15);
      tl.to(gaspar, { y: -85, duration: 0.20, ease: "power1.out" }, 7.15);
      tl.to(gaspar, { y:   0, duration: 0.20, ease: "power1.in" },  7.35);
      tl.to(gaspIn, { scaleY: 0.92, duration: 0.08, ease: "power1.out" }, 7.55);
      tl.to(gaspIn, { scaleY: 1.00, duration: 0.12, ease: "power1.inOut" }, 7.63);

      tl.to(gaspar, { x: -630, duration: 0.40, ease: "none" }, 7.75);
      tl.to(gaspar, { y: -85, duration: 0.20, ease: "power1.out" }, 7.75);
      tl.to(gaspar, { y:   0, duration: 0.20, ease: "power1.in" },  7.95);
      tl.to(gaspIn, { scaleY: 0.92, duration: 0.08, ease: "power1.out" }, 8.15);
      tl.to(gaspIn, { scaleY: 1.00, duration: 0.12, ease: "power1.inOut" }, 8.23);

      /* espreme o corpo contra a fenda */
      tl.to(gaspIn, { scaleX: 0.82, scaleY: 1.10, duration: 0.30, ease: "power2.out" }, 8.35);
      tl.to(gaspIn, { rotation: -3, duration: 0.12, ease: "sine.inOut" }, 8.70);
      tl.to(gaspIn, { rotation:  3, duration: 0.12, ease: "sine.inOut" }, 8.82);
      tl.to(gaspIn, { rotation:  0, duration: 0.12, ease: "sine.inOut" }, 8.94);

      /* e some — escala a zero na fenda escura */
      tl.to(gaspIn, { scaleX: 0, scaleY: 0, duration: 0.40, ease: "power2.in" }, 9.10);
      tl.to(gaspar, { y: -15, duration: 0.40, ease: "power2.in" }, 9.10);

      /* os outros seguem o sapo com o olhar */
      tl.to(brunoEyes, { x: -6, y: 3, duration: 0.30, ease: "power2.out" }, 7.10);
      tl.to(liaEyes,   { x: -5, y: 0, duration: 0.30, ease: "power2.out" }, 7.20);
      blink(ticoEyes, 8.50);

      /* =========================================================
         CENA 4 (9.0–13.0s) — Lia levanta a mão; os três se voltam
         para ela. Batida final: eles se olham, decididos.
         ========================================================= */

      tl.to(liaArmR, { rotation: -150, duration: 0.45, ease: "back.out(1.7)" }, 9.05);

      speak(liaOpen, liaClosed, 9.27, 11.68);
      tl.fromTo(b4, { opacity: 0, scale: 0.5 },
                    { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.4)" }, 9.27);
      tl.to(b4, { y: -8, duration: 0.75, ease: "sine.inOut" }, 9.80);
      tl.to(b4, { y:  0, duration: 0.75, ease: "sine.inOut" }, 10.55);
      tl.to(b4, { opacity: 0, scale: 0.55, duration: 0.16, ease: "power2.in" }, 11.52);

      /* os três se voltam para ela */
      tl.to(bruno, { rotation: 2, duration: 0.40, ease: "power2.inOut" }, 9.45);
      tl.to(brunoEyes, { x: 7, y: 0, duration: 0.35, ease: "power2.out" }, 9.45);
      tl.to(bird, { scaleX: 1, duration: 0.22, ease: "power2.inOut" }, 9.50);
      tl.to(tilt, { rotation: -5, duration: 0.30, ease: "power2.out" }, 9.62);
      /* Gaspar espia e salta de volta da fresta */
      tl.to(gaspar, { y: 0, duration: 0.30, ease: "power2.out" }, 9.75);
      tl.to(gaspIn, { scaleX: 1, scaleY: 1, duration: 0.42, ease: "back.out(1.9)" }, 9.75);
      tl.to(gaspEyes, { x: 6, y: 0, duration: 0.30, ease: "power2.out" }, 10.20);

      /* o anel butter volta, firme — o plano existe */
      tl.to(ring, { opacity: 0.85, scale: 1, duration: 0.90, ease: "sine.inOut" }, 10.80);

      blink(brunoEyes, 10.50);
      blink(gaspEyes, 10.90);

      /* batida final — eles se olham, decididos */
      tl.to(liaArmR, { rotation: -35, duration: 0.40, ease: "power2.inOut" }, 12.00);
      tl.to(liaEyes, { x: -5, y: 0, duration: 0.30, ease: "power2.out" }, 11.85);
      blink(ticoEyes, 12.05);
      tl.to(wing, { rotation: -18, duration: 0.14, ease: "sine.inOut" }, 12.20);
      tl.to(wing, { rotation:   0, duration: 0.18, ease: "sine.out" },   12.34);
      tl.to(fly, { y: -10, duration: 0.15, ease: "power1.out" }, 12.20);
      tl.to(fly, { y:   0, duration: 0.16, ease: "power1.in" },  12.35);
      tl.to(lia, { y: 7, duration: 0.16, ease: "power1.inOut" }, 12.15);
      tl.to(lia, { y: 0, duration: 0.20, ease: "power1.inOut" }, 12.31);
      tl.to(bruno, { y: 6, duration: 0.16, ease: "power1.inOut" }, 12.30);
      tl.to(bruno, { y: 0, duration: 0.20, ease: "power1.inOut" }, 12.46);
      tl.to(gaspar, { y: -20, duration: 0.18, ease: "power1.out" }, 12.40);
      tl.to(gaspar, { y:   0, duration: 0.18, ease: "power1.in" },  12.58);
      blink(liaEyes, 12.50);

      /* estrela butter da decisão */
      tl.fromTo(star, { opacity: 0, scale: 0.3 },
                      { opacity: 1, scale: 1, duration: 0.40, ease: "back.out(2.2)" }, 12.45);

      /* nuvens à deriva — a cena nunca congela */
      tl.to(cloudA, { x: 90, duration: 13, ease: "none" }, 0);
      tl.to(cloudB, { x: 62, duration: 13, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["s08-juntos"] = tl;
    })();
  </script>
