      /* ---------- receita de lip flap (8 Hz, determinística) ---------- */
      function speak(openEl, closedEl, start, end) {
        var t = start, on = true, FLAP = 0.0625;

          tl.set(closedEl, { opacity: on ? 0 : 1 }, t);
          on = !on;
          t += FLAP;
        }
        tl.set(openEl,   { opacity: 0 }, end);

      /* =========================================================

      /* agachamento até a altura do sapo + olhar para baixo-esquerda */

      tl.to(liaEyes, { x: -4, duration: 0.30, ease: "power2.out" }, 4.40);
      tl.to(liaEyes, { scaleY: 0.1, duration: 0.06 }, 4.85);
      tl.to(liaEyes, { scaleY: 1,   duration: 0.06 }, 4.91);

      /* mão estendida — "vem comigo" */
      tl.to(armL, { rotation: 60, duration: 0.50, ease: "power2.out" }, 4.90);

      /* Tico se equilibra no ombro durante o agachamento */
      tl.to(wing, { rotation: -30, duration: 0.10, ease: "sine.inOut" }, 4.55);
      tl.to(wing, { rotation:  15, duration: 0.10, ease: "sine.inOut" }, 4.65);

      /* =========================================================

      tl.to(frog, { scaleY: 0.85, duration: 0.12, ease: "power2.in" },  6.28);
      tl.to(frog, { scaleY: 1.12, duration: 0.20, ease: "power2.out" }, 6.40);
      tl.to(hop,  { x: 190, duration: 0.26, ease: "none" },       6.40);

      tl.to(reedsR, { rotation: 0,   duration: 0.25, ease: "sine.out" },   6.71);

      tl.to(crouch, { scaleY: 1, rotation: 0, duration: 0.50, ease: "power2.inOut" }, 6.90);

      tl.to(frog, { y: -8, duration: 0.12, ease: "power2.out" }, 7.55);
      tl.to(frog, { y:  0, duration: 0.14, ease: "power2.in" },  7.67);

      tl.to(frog, { y:  0, duration: 0.13, ease: "power2.in" },  8.41);

      tl.to(frogPupils, { scaleY: 1,   duration: 0.06 }, 8.16);

      /* =========================================================
         CENA 4 (9.1–11.0s) — os três se viram para a montanha à

      tl.to(liaEyes, { x: 6, duration: 0.45, ease: "power2.out" }, 9.15);

      /* Lia aponta o caminho da montanha */
      tl.to(armR, { rotation: -55, duration: 0.50, ease: "back.out(1.7)" }, 9.35);

      /* Tico dá meia-volta e levanta voo rumo à montanha */
      tl.to(tico, { scaleX: 1, duration: 0.20, ease: "power2.inOut" }, 9.30);
      (function () {
        var t = 9.40, up = true;
        while (t < 10.90) {
          tl.to(wing, { rotation: up ? -38 : 20, duration: 0.105, ease: "sine.inOut" }, t);
          up = !up;

      tl.to(liaWalk, { x: 24, duration: 0.60, ease: "power1.inOut" }, 10.20);
      tl.to(hop, { x: 440, duration: 0.30, ease: "none" },      10.35);
      tl.to(hop, { y:   2, duration: 0.14, ease: "power2.out" }, 10.35);
      tl.to(hop, { y:  32, duration: 0.16, ease: "power2.in" },  10.49);

      /* juncos — balanço de fundo ao longo da cena */
      tl.to(reedsL, { rotation: 1.8, duration: 1.60, ease: "sine.inOut" }, 0.30);
      tl.to(reedsL, { rotation: 0,   duration: 1.60, ease: "sine.inOut" }, 1.90);
      tl.to(reedsL, { rotation: 1.5, duration: 1.50, ease: "sine.inOut" }, 5.20);
      tl.to(reedsL, { rotation: 0,   duration: 1.50, ease: "sine.inOut" }, 6.70);
      tl.to(reedsL, { rotation: 1.8, duration: 1.00, ease: "sine.inOut" }, 9.00);
      tl.to(reedsL, { rotation: 0.8, duration: 0.90, ease: "sine.inOut" }, 10.00);
      tl.to(reedsR, { rotation: -1.5, duration: 1.50, ease: "sine.inOut" }, 0.90);
      tl.to(reedsR, { rotation: 0,    duration: 1.50, ease: "sine.inOut" }, 2.40);
      tl.to(reedsR, { rotation: -1.8, duration: 1.00, ease: "sine.inOut" }, 4.40);
      tl.to(reedsR, { rotation: 0,    duration: 1.00, ease: "sine.inOut" }, 5.40);
      tl.to(reedsR, { rotation: -1.2, duration: 1.20, ease: "sine.inOut" }, 9.60);

      /* nuvens à deriva — o brejo nunca congela */
      tl.to(cloudA, { x: 88, duration: 11, ease: "none" }, 0);
      tl.to(cloudB, { x: 60, duration: 11, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["s04-gaspar"] = tl;
    })();
