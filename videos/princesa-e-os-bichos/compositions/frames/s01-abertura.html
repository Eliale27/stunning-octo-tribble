      var q = function (sel) { return root.querySelector(sel); };

      /* trees rooted on the hill */

        { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.62, ease: 'back.out(2)', stagger: 0.13 }, 1.02);

      /* butter castle rises on the right third */
      tl.fromTo(q('#s01-abertura-castle'),
        { y: 150, scaleY: 0.82, opacity: 0 },
        { y: 0, scaleY: 1, opacity: 1, duration: 0.9, ease: 'back.out(1.5)' }, 1.22);

      /* ---------- Scene 2 (2.0–4.5s) — the river draws itself ---------- */
      var outline = q('#s01-abertura-river-outline');
      var water = q('#s01-abertura-river-water');
      var rawLen = (outline && outline.getTotalLength) ? outline.getTotalLength() : 0;
      var len = (rawLen > 1) ? Math.ceil(rawLen) + 4 : 780;
      gsap.set([outline, water], { strokeDasharray: len });

      tl.fromTo(outline,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 2.15, ease: 'power1.inOut' }, 2.0);
      tl.fromTo(water,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 2.15, ease: 'power1.inOut' }, 2.14);

      /* daisies pop on the hill while the water runs */
      tl.fromTo(qa('.s01-abertura-daisy'),

        { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: 'back.out(2.6)', stagger: 0.22 }, 2.55);

        { scale: 0.2, opacity: 0 },

        { scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(2.8)' }, 4.42);

        { scale: 1, y: 0, opacity: 1, duration: 0.68, ease: 'back.out(2.2)', stagger: 0.12 }, 4.56);

      /* three cream clouds drift slowly across the sky */
      var clouds = qa('.s01-abertura-cloud');
      tl.fromTo(clouds[0], { x: -70, opacity: 0 }, { x: -24, opacity: 1, duration: 0.95, ease: 'power2.out' }, 4.5);
      tl.to(clouds[0], { x: 44, duration: 2.5, ease: 'none' }, 5.45);

      tl.fromTo(clouds[1], { x: 66, opacity: 0 }, { x: 26, opacity: 1, duration: 0.95, ease: 'power2.out' }, 4.82);
      tl.to(clouds[1], { x: -30, duration: 2.2, ease: 'none' }, 5.77);

      tl.fromTo(clouds[2], { x: -58, opacity: 0 }, { x: -18, opacity: 1, duration: 0.95, ease: 'power2.out' }, 5.14);
      tl.to(clouds[2], { x: 34, duration: 1.9, ease: 'none' }, 6.09);

      /* water keeps running under the held title */
      tl.to(qa('.s01-abertura-ripple')[0], { x: -10, y: 34, duration: 2.6, ease: 'none' }, 5.3);
      tl.to(qa('.s01-abertura-ripple')[1], { x: -14, y: 30, duration: 2.6, ease: 'none' }, 5.5);
      tl.to(qa('.s01-abertura-ripple')[2], { x: -6, y: 26, duration: 2.6, ease: 'none' }, 5.7);

      /* two sparkle stars land last */
      tl.fromTo(q('.s01-abertura-star-a'),
        { scale: 0, rotation: -90, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: 'back.out(3)' }, 5.62);

        { scale: 0, rotation: 90, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: 'back.out(3)' }, 6.05);

      /* hold the read to the end of the frame */
      tl.set(q('#s01-abertura-sky'), { opacity: 1 }, 8);

      window.__timelines = window.__timelines || {};
