  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var LIA        = "#s03-tico-lia";
      var lean       = document.querySelector("#s03-tico-lia");
      var liaEyes    = document.querySelector("#s03-tico-lia .eyes");
      var liaOpen    = document.querySelector("#s03-tico-lia .mouth-open");
      var liaClosed  = document.querySelector("#s03-tico-lia .mouth-closed");
      var armR       = document.querySelector("#s03-tico-lia .arm-r");

      var fly        = document.querySelector("#s03-tico-fly");
      var tilt       = document.querySelector("#s03-tico-tilt");
      var bird       = document.querySelector("#s03-tico-bird");
      var wing       = document.querySelector("#s03-tico-bird .wing");
      var ticoBody   = document.querySelector("#s03-tico-bird .body");
      var ticoEyes   = document.querySelector("#s03-tico-bird .eyes");
      var ticoOpen   = document.querySelector("#s03-tico-bird .mouth-open");
      var ticoClosed = document.querySelector("#s03-tico-bird .mouth-closed");

      var cloudA = document.querySelector("#s03-tico-cloudA");
      var cloudB = document.querySelector("#s03-tico-cloudB");
      var sp1 = document.querySelector("#s03-tico-sp1");
      var sp2 = document.querySelector("#s03-tico-sp2");
      var sp3 = document.querySelector("#s03-tico-sp3");
      var star = document.querySelector("#s03-tico-star");

      var b1 = document.querySelector("#s03-tico-b1");
      var b2 = document.querySelector("#s03-tico-b2");
      var b3 = document.querySelector("#s03-tico-b3");

      var tl = gsap.timeline({ paused: true });

      /* ---------- estado inicial (t = 0) ---------- */
      tl.set(lean,      { rotation: 0, svgOrigin: "430 870" }, 0);
      tl.set(liaEyes,   { scaleY: 1, x: 0 }, 0);
      tl.set(liaOpen,   { opacity: 0 }, 0);
      tl.set(liaClosed, { opacity: 1 }, 0);
      tl.set(armR,      { rotation: 0, svgOrigin: "146 147" }, 0);

      tl.set(fly,        { x: 1484, y: -410 }, 0);
      tl.set(tilt,       { rotation: 0, svgOrigin: "70 112" }, 0);
      tl.set(bird,       { scaleX: -1, svgOrigin: "70 66" }, 0);
      tl.set(wing,       { rotation: 0, svgOrigin: "64 57" }, 0);
      tl.set(ticoBody,   { scaleY: 1, svgOrigin: "70 100" }, 0);
      tl.set(ticoEyes,   { scaleY: 1, x: 0 }, 0);
      tl.set(ticoOpen,   { opacity: 0 }, 0);
      tl.set(ticoClosed, { opacity: 1 }, 0);

      tl.set([sp1, sp2, sp3, star], { opacity: 0, scale: 0.35, svgOrigin: "0 0" }, 0);
      tl.set([b1, b2, b3], { opacity: 0, scale: 0.5, x: 0, y: 0, transformOrigin: "48px 170px" }, 0);
      tl.set(cloudA, { x: 0 }, 0);
      tl.set(cloudB, { x: 0 }, 0);

      /* ---------- receita de lip flap (8 Hz, determinística) ---------- */
      function speak(openEl, closedEl, start, end) {
        var t = start, on = true, FLAP = 0.0625;
        while (t < end - 0.001) {
          tl.set(openEl,   { opacity: on ? 1 : 0 }, t);
          tl.set(closedEl, { opacity: on ? 0 : 1 }, t);
          on = !on;
          t += FLAP;
        }
        tl.set(openEl,   { opacity: 0 }, end);
        tl.set(closedEl, { opacity: 1 }, end);
      }

      /* =========================================================
         CENA 1 (0.0–3.2s) — Tico entra voando pela direita numa
         curva larga, asa oscilando, muito agitado.
         ========================================================= */

      tl.to(fly, { x: 1004, y: -260, duration: 0.50, ease: "power1.out" },   0.00);
      tl.to(fly, { x:  594, y: -430, duration: 0.50, ease: "power1.inOut" }, 0.50);
      tl.to(fly, { x:  304, y: -310, duration: 0.50, ease: "power1.inOut" }, 1.00);
      tl.to(fly, { x:  144, y: -440, duration: 0.50, ease: "power1.inOut" }, 1.50);
      tl.to(fly, { x:  -36, y: -340, duration: 0.45, ease: "power1.inOut" }, 2.00);
      tl.to(fly, { x:    4, y: -170, duration: 0.40, ease: "power1.inOut" }, 2.45);
      tl.to(fly, { x:    0, y:    0, duration: 0.45, ease: "power2.out" },   2.85);

      /* asa oscilando durante todo o voo */
      (function () {
        var t = 0.00, up = true, WD = 0.105;
        while (t < 3.30) {
          tl.to(wing, { rotation: up ? -36 : 22, duration: WD, ease: "sine.inOut" }, t);
          up = !up;
          t += WD;
        }
      })();
      tl.to(wing, { rotation: 0, duration: 0.22, ease: "sine.out" }, 3.30);

      /* ele dá meia-volta na curva final e passa a olhar para a direita */
      tl.to(bird, { scaleX: 1, duration: 0.24, ease: "power2.inOut" }, 2.40);

      /* fala do Tico + balão */
      speak(ticoOpen, ticoClosed, 0.12, 3.188);
      tl.fromTo(b1, { opacity: 0, scale: 0.5 },
                    { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.4)" }, 0.12);
      tl.to(b1, { x: -180, y:  20, duration: 0.70, ease: "power1.inOut" }, 0.20);
      tl.to(b1, { x: -420, y: -10, duration: 0.60, ease: "power1.inOut" }, 0.90);
      tl.to(b1, { x: -720, y:  20, duration: 0.55, ease: "power1.inOut" }, 1.50);
      tl.to(b1, { x: -900, y:   0, duration: 0.55, ease: "power1.inOut" }, 2.05);
      tl.to(b1, { x: -950, y:  20, duration: 0.55, ease: "power1.inOut" }, 2.60);
      tl.to(b1, { opacity: 0, scale: 0.55, duration: 0.16, ease: "power2.in" }, 3.03);

      /* Lia acompanha o voo: olhar, piscada e um leve balanço */
      tl.to(liaEyes, { x: 3, duration: 0.28, ease: "power2.out" }, 0.55);
      tl.to(liaEyes, { scaleY: 0.1, duration: 0.06 }, 1.35);
      tl.to(liaEyes, { scaleY: 1,   duration: 0.06 }, 1.41);
      tl.to(lean, { rotation: 0.8, duration: 0.55, ease: "sine.inOut" }, 0.95);
      tl.to(lean, { rotation: 0,   duration: 0.60, ease: "sine.inOut" }, 1.50);

      /* ela estende o braço para oferecer poleiro */
      tl.to(armR, { rotation: -66, duration: 0.62, ease: "power2.out" }, 2.10);

      /* =========================================================
         CENA 2 (3.2–5.8s) — pouso no braço; Lia fala calma.
         ========================================================= */

      tl.to(fly, { y: 9,  duration: 0.10, ease: "power2.out" },   3.30);
      tl.to(fly, { y: 0,  duration: 0.24, ease: "back.out(1.8)" }, 3.40);
      tl.to(armR, { rotation: -62.5, duration: 0.10, ease: "power2.out" },   3.30);
      tl.to(armR, { rotation: -66,   duration: 0.26, ease: "back.out(1.8)" }, 3.40);

      /* Tico ofegante depois da corrida ("respira") */
